<!doctype html>
<html lang="en" data-midgard-auth="checking">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        Midgard Legacy - Wagon Shed
    </title>

    <link
        rel="icon"
        type="image/png"
        href="../images/Logo/favicon.png"
    >

    <link
        rel="stylesheet"
        href="../css/style.css?v=4"
    >

    <link
        rel="stylesheet"
        href="../css/game-panels.css?v=1"
    >

    <link
        rel="stylesheet"
        href="../css/wagon-shed.css?v=1"
    >

</head>

<body>

    <div class="game-layout">

        <div id="sidebar"></div>

        <main class="main-area">

            <div id="topbar"></div>


            <!-- =========================
                 WAGON SHED PAGE
            ========================= -->

            <div class="game-page">


                <!-- =========================
                     PAGE HEADER
                ========================= -->

                <section class="game-page-header">

                    <div class="game-page-heading">

                        <h1>
                            🛒 Wagon Shed
                        </h1>

                        <p>
                            Repair, inspect and manage the transport
                            used to carry resources across Midgard.
                        </p>

                    </div>

                    <div class="game-badge">
                        🛞 Transport
                    </div>

                </section>


                <!-- =========================
                     WAGON SHED LAYOUT
                ========================= -->

                <section class="wagon-shed-layout">


                    <!-- Main Wagon Panel -->

                    <section
                        id="wagon-shed-card"
                        class="wagon-shed-panel"
                    >

                        <div class="wagon-loading-state">

                            <div class="wagon-loading-icon">
                                🛒
                            </div>

                            <p>
                                Loading Wagon Shed...
                            </p>

                        </div>

                    </section>


                    <!-- Side Information -->

                    <aside class="wagon-shed-side">


                        <!-- Wagon Builder -->

                        <section class="wagon-builder-card">

                            <div class="wagon-builder-icon">
                                🛞
                            </div>

                            <div>

                                <h2>
                                    Need Wagon Parts?
                                </h2>

                                <p>
                                    Visit Haldor the Wagon Builder to buy
                                    wheels, axles, fittings and horse gear.
                                </p>

                                <a
                                    class="wagon-builder-button"
                                    href="wagon-builder.html"
                                >
                                    Visit Wagon Builder
                                </a>

                            </div>

                        </section>


                        <!-- Message -->

                        <p
                            id="wagon-shed-message"
                            class="wagon-shed-message"
                            aria-live="polite"
                        ></p>

                    </aside>

                </section>

            </div>

        </main>

    </div>


    <!-- =========================
         SCRIPTS
    ========================= -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="../js/config.js"></script>
    <script src="../js/constants.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/game-utils.js"></script>
    <script src="../js/components.js?v=4"></script>
    <script src="../js/wagon-shed.js"></script>

</body>

</html>
