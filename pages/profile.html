<!doctype html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        Midgard Legacy - Profile
    </title>
    <link rel="icon" type="image/png" href="../images/Logo/favicon.png">

    <link
        rel="stylesheet"
        href="../css/style.css?v=4"
    >

</head>

<body>

    <div class="game-layout">

        <div id="sidebar"></div>

        <main class="main-area">

            <div id="topbar"></div>

            <section
                id="profile-card"
                class="profile-card"
            >
                Loading profile...
            </section>

            <section
                id="profile-actions"
                class="profile-actions"
            ></section>

            <section class="card">

                <h3>🛡️ Saga Hall</h3>

                <div
                    id="saga-cards"
                    class="saga-grid"
                >
                    <p>
                        No Saga cards unlocked yet.
                    </p>
                </div>

            </section>

        </main>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="../js/config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/game-utils.js"></script>
    <script src="../js/components.js?v=4"></script>
    <script src="../js/profile.js"></script>

</body>

</html>
