<!doctype html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Midgard Legacy - King's Raffle</title>
        <link rel="icon" type="image/png" href="../images/Logo/favicon.png">
        <link rel="stylesheet" href="../css/style.css">
    </head>
    <body>
        <div class="game-layout">
            <div id="sidebar"></div>
            <main class="main-area">
                <div id="topbar"></div>
                <section class="page-header">
                    <div class="page-title">
                        <h1>🍀 King's Weekly Raffle</h1>
                        <p>One entry per player each day. Every 1,000 silver of contributed value becomes one entry.</p>
                    </div>
                </section>
                <section class="cards">
                    <div class="card">
                        <h3>Your Private Entries</h3>
                        <p id="my-lottery-entries">0</p>
                        <p>Only you can see this number.</p>
                    </div>
                    <div class="card">
                        <h3>Current Prize Pool</h3>
                        <div id="lottery-pool">Loading...</div>
                    </div>
                </section>
                <section class="card">
                    <h3>Enter Today</h3>
                    <select id="lottery-item"></select>
                    <input id="lottery-quantity" type="number" min="1" value="1">
                    <button id="lottery-enter-button">Enter Raffle</button>
                    <p id="lottery-message"></p>
                </section>
                <section class="home-grid">
                    <div class="card">
                        <h3>Last 100 Winners</h3>
                        <div id="lottery-history"></div>
                    </div>
                    <div class="card">
                        <h3>Top 10 Biggest Jackpots</h3>
                        <div id="lottery-biggest"></div>
                    </div>
                </section>
            </main>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="../js/auth.js"></script>
        <script src="../js/game-utils.js"></script>
        <script src="../js/components.js"></script>
        <script src="../js/lottery.js"></script>
    </body>
</html>
