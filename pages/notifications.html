<!doctype html>
<html lang="en" data-midgard-auth="checking">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Notifications | Midgard Legacy</title>
    <link rel="icon" type="image/png" href="../images/Logo/favicon.png">
    <link rel="stylesheet" href="../css/style.css?v=8">
    <link rel="stylesheet" href="../css/game-panels.css?v=1">
    <link rel="stylesheet" href="../css/notifications.css?v=1">
</head>
<body>
<div class="game-layout">
    <div id="sidebar"></div>
    <main class="main-area">
        <div id="topbar"></div>
        <div class="game-page">
            <section class="game-page-header">
                <div class="game-page-heading">
                    <h1>🔔 Notifications</h1>
                    <p>Skill levels, equipment unlocks and important events from across Midgard.</p>
                </div>
                <div class="game-badge"><span id="notification-page-unread">0</span> unread</div>
            </section>
            <div id="notification-message" class="notification-message" aria-live="polite"></div>
            <section class="notification-toolbar">
                <div class="notification-filters" aria-label="Notification filters">
                    <button class="active" data-notification-filter="all">All</button>
                    <button data-notification-filter="unread">Unread</button>
                    <button data-notification-filter="skill_level">Skills</button>
                    <button data-notification-filter="equipment">Equipment</button>
                </div>
                <div class="notification-actions">
                    <button id="mark-all-read">Mark all as read</button>
                    <button id="delete-read">Delete read</button>
                </div>
            </section>
            <section id="notification-list" class="notification-list"></section>
        </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/game-utils.js"></script>
<script src="../js/components.js?v=5"></script>
    <script src="../js/tutorial.js?v=2"></script>
<script src="../js/notifications.js?v=1"></script>
</body>
</html>
