<!doctype html>
<html lang="en" data-midgard-auth="checking">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        Midgard Legacy - Friends & Enemies
    </title>

    <link
        rel="icon"
        type="image/png"
        href="../images/Logo/favicon.png"
    >

    <link
        rel="stylesheet"
        href="../css/style.css?v=9"
    >

    <link
        rel="stylesheet"
        href="../css/game-panels.css?v=1"
    >

    <link
        rel="stylesheet"
        href="../css/friends-enemies.css?v=1"
    >

</head>

<body>

    <div class="game-layout">

        <div id="sidebar"></div>

        <main class="main-area">

            <div id="topbar"></div>

            <div class="game-page">

                <section class="game-page-header">

                    <div class="game-page-heading">

                        <h1>
                            🤝 Friends &amp; Enemies
                        </h1>

                        <p>
                            Keep your allies close and your rivals closer.
                        </p>

                    </div>

                    <div class="game-badge">
                        ⚔️ Relations
                    </div>

                </section>

                <div
                    id="relations-message"
                    class="social-message"
                    role="status"
                    aria-live="polite"
                ></div>

                <section class="social-grid">

                    <article class="social-section">

                        <header class="social-section-heading">

                            <div class="social-section-icon">
                                🤝
                            </div>

                            <div>

                                <h2>
                                    Friends
                                    <span id="friend-count">(0)</span>
                                </h2>

                                <p>
                                    Vikings you trust and have chosen as allies.
                                </p>

                            </div>

                            <span class="social-section-badge friend-badge">
                                Allies
                            </span>

                        </header>

                        <div
                            id="friends-list"
                            class="social-list"
                        >

                            <div class="social-loading-state">

                                <span>
                                    🤝
                                </span>

                                <p>
                                    Loading friends...
                                </p>

                            </div>

                        </div>

                    </article>

                    <article class="social-section">

                        <header class="social-section-heading">

                            <div class="social-section-icon enemy-icon">
                                ⚔️
                            </div>

                            <div>

                                <h2>
                                    Enemies
                                    <span id="enemy-count">(0)</span>
                                </h2>

                                <p>
                                    Rivals and hostile Vikings to watch closely.
                                </p>

                            </div>

                            <span class="social-section-badge enemy-badge">
                                Rivals
                            </span>

                        </header>

                        <div
                            id="enemies-list"
                            class="social-list"
                        >

                            <div class="social-loading-state">

                                <span>
                                    ⚔️
                                </span>

                                <p>
                                    Loading enemies...
                                </p>

                            </div>

                        </div>

                    </article>

                </section>

            </div>

        </main>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="../js/config.js"></script>
    <script src="../js/constants.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/game-utils.js"></script>
    <script src="../js/components.js?v=4"></script>
    <script src="../js/tutorial.js?v=3"></script>
    <script src="../js/friends-enemies.js"></script>

</body>

</html>
