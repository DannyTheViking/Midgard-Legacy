<!doctype html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        Village Healer | Midgard Legacy
    </title>

    <link
        rel="icon"
        type="image/png"
        href="../images/Logo/favicon.png"
    >

    <link
        rel="stylesheet"
        href="../css/style.css?v=4"
    >

    <link
        rel="stylesheet"
        href="../css/village-healer.css?v=2"
    >

</head>

<body>

    <div class="game-layout">

        <!-- Shared sidebar -->
        <div id="sidebar"></div>

        <main class="main-area healer-page">

            <!-- Shared topbar -->
            <div id="topbar"></div>

            <section class="page-header">

                <div class="page-title">

                    <h1>
                        🌿 Village Healer
                    </h1>

                    <p>
                        Recover naturally, or use your training
                        to get someone back on their feet.
                    </p>

                </div>

                <nav
                    id="hospital-pagination"
                    class="hospital-pagination"
                    aria-label="Hospital patient pages"
                    hidden
                ></nav>

            </section>

            <div
                id="healer-message"
                class="healer-message"
                aria-live="polite"
            ></div>

            <section
                id="my-hospital-card"
                class="my-hospital-card"
                hidden
            ></section>

            <section class="healer-summary">

                <div>

                    <span>
                        Yrsa jobs
                    </span>

                    <strong id="healer-jobs">
                        0
                    </strong>

                </div>

                <div>

                    <span>
                        Healing unlocked
                    </span>

                    <strong id="healing-level">
                        Locked
                    </strong>

                </div>

                <div>

                    <span>
                        Ward patients
                    </span>

                    <strong id="patient-count">
                        0
                    </strong>

                </div>

            </section>

            <section>

                <h2>
                    Patients in the healer hut
                </h2>

                <div
                    id="hospital-grid"
                    class="hospital-grid"
                >

                    <p>
                        Checking the beds...
                    </p>

                </div>

            </section>

        </main>

    </div>

    <!-- Supabase library -->
    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

    <!-- Shared game files -->
    <script src="../js/config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/game-utils.js"></script>
    <script src="../js/constants.js"></script>
    <script src="../js/components.js?v=4"></script>

    <!-- Village Healer -->
    <script src="../js/village-healer.js?v=2"></script>

</body>

</html>
