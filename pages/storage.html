<!doctype html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Midgard Legacy - Storage</title>
        <link rel="icon" type="image/png" href="../images/Logo/favicon.png">
        <link rel="stylesheet" href="../css/style.css?v=4">
    </head>
    <body>
        <div class="game-layout">
            <div id="sidebar"></div>
            <main class="main-area">
                <div id="topbar"></div>
                <section class="page-header">
                    <div class="page-title">
                        <h1>📦 Storage Yard</h1>
                        <p>Your permanent storage is unlimited. Load resources into your Backpack or active transport before travelling.</p>
                    </div>
                </section>
                <section class="cards" id="storage-cards"></section>
                <section class="card">
                    <h3>🎒 Backpack &amp; Active Transport</h3>
                    <div id="storage-cart"></div>
                    <button id="unload-cart-button">Unload Transport</button>
                    <button id="unload-backpack-button">Unload Backpack</button>
                    <p id="storage-message"></p>
                </section>
            </main>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="../js/auth.js"></script>
        <script src="../js/game-utils.js"></script>
        <script src="../js/components.js?v=4"></script>
        <script src="../js/config.js"></script>
        <script src="../js/constants.js"></script>
        <script src="../js/storage.js"></script>
    </body>
</html>
