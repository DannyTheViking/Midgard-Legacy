<!doctype html>
<html lang="en" data-midgard-auth="checking">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Midgard Legacy - Viking Missions</title>
    <link rel="icon" type="image/png" href="../images/Logo/favicon.png">
    <link rel="stylesheet" href="../css/style.css?v=9">
    <link rel="stylesheet" href="../css/game-panels.css?v=1">
    <link rel="stylesheet" href="../css/missions.css?v=1">
    <link rel="stylesheet" href="../css/mission-patron.css?v=2">
</head>
<body>
<div class="game-layout">
    <div id="sidebar"></div>
    <main class="main-area">
        <div id="topbar"></div>
        <div class="game-page mission-page">
            <section class="game-page-header mission-header">
                <div class="game-page-heading">
                    <p class="mission-kicker">🗝️ VILLAGE PATRONS</p>
                    <h1>Patron Favours</h1>
                    <p>Clients bring powerful Vikings their broken deals, missing goods, debts and private problems. Patrons provide help or protection, then send trusted people to settle the favour.</p>
                </div>
                <div class="mission-daily-box">
                    <span>Today's favours</span>
                    <strong id="mission-daily-count">0 / 5</strong>
                    <div class="mission-daily-track"><span id="mission-daily-fill"></span></div>
                    <small>Resets at midnight</small>
                </div>
            </section>

            <div id="mission-message" class="mission-message" role="status" aria-live="polite"></div>

            <section class="mission-contact-strip-wrap" aria-label="Village patrons">
                <button id="mission-contact-prev" class="mission-strip-arrow" type="button" aria-label="Previous patrons">‹</button>
                <div id="mission-contact-strip" class="mission-contact-strip"></div>
                <button id="mission-contact-next" class="mission-strip-arrow" type="button" aria-label="Next patrons">›</button>
            </section>

            <section class="mission-workspace">
                <aside id="mission-contact-card" class="mission-contact-card"></aside>
                <div class="mission-contract-area">
                    <article id="mission-main-card" class="mission-contract-card"></article>
                    <section id="mission-bonus-area" class="mission-bonus-area"></section>
                </div>
            </section>
        </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="../js/constants.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/game-utils.js"></script>
<script src="../js/components.js?v=5"></script>
<script src="../js/tutorial.js?v=12"></script>
<script src="../js/missions.js?v=3"></script>
</body>
</html>
