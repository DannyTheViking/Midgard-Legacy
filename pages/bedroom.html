<!doctype html>
<html lang="en" data-midgard-auth="checking">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="icon" type="image/png" href="../images/Logo/favicon.png">
    <link rel="stylesheet" href="../css/style.css?v=9">
    <link rel="stylesheet" href="../css/game-panels.css?v=1">
    <link rel="stylesheet" href="../css/character-doll.css?v=1">
    <link rel="stylesheet" href="../css/bedroom.css?v=2">
    <title>Midgard Legacy - Bedroom</title>
</head>
<body>
<div class="game-layout">
    <div id="sidebar"></div>
    <main class="main-area">
        <div id="topbar"></div>
        <div class="game-page bedroom-page">
            <section class="game-page-header">
                <div class="game-page-heading">
                    <h1>🛏️ Bedroom &amp; Equipment</h1>
                    <p>Equip your Viking and see every piece of armour and every weapon on the full character.</p>
                </div>
                <div class="game-badge">No Weight Limit</div>
            </section>
            <section class="bedroom-layout">
                <aside class="equipment-figure">
                    <div class="character-body-picker" aria-label="Choose Viking body">
                        <span>Viking body</span>
                        <div>
                            <button type="button" data-body-type="male">Male</button>
                            <button type="button" data-body-type="female">Female</button>
                        </div>
                    </div>
                    <div id="bedroom-character-doll" class="bedroom-character-stage" aria-live="polite"></div>
                    <h2>Gear on your Viking</h2>
                    <div id="equipped-summary">Loading...</div>
                    <div id="equipment-totals"></div>
                </aside>
                <div>
                    <div class="equipment-tabs" id="equipment-tabs"></div>
                    <div id="equipment-list" class="equipment-list"></div>
                    <div id="equipment-message" role="status" aria-live="polite"></div>
                </div>
            </section>
        </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/game-utils.js"></script>
<script src="../js/components.js"></script>
<script src="../js/tutorial.js?v=12"></script>
<script src="../js/character-doll.js?v=1"></script>
<script src="../js/bedroom.js?v=30"></script>
</body>
</html>
