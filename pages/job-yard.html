<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Yard | Midgard Legacy</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/job-yard.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div id="topbar"></div>
  <div class="game-layout">
    <aside id="sidebar"></aside>
    <main class="main-content">
      <section class="page-header">
        <div class="page-title">
          <h1>📜 Job Yard</h1>
          <p>Help each villager, earn their trust and learn their profession.</p>
        </div>
      </section>

      <div id="job-yard-message" class="job-message" aria-live="polite"></div>
      <section id="npc-job-grid" class="npc-job-grid">
        <p>Loading village jobs…</p>
      </section>
    </main>
  </div>

  <!-- Keep these filenames aligned with your current shared files. -->
  <script src="../js/supabase.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/job-yard.js"></script>
</body>
</html>
