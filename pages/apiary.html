<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midgard Legacy - Personal Bee Yard</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<div class="game-layout">

    <div id="sidebar"></div>

    <main class="main-area">

        <div id="topbar"></div>

        <section class="page-header">
            <div class="page-title">
                <h1>🐝 Personal Bee Yard</h1>
                <p>Build your own hives, install captured Queen Bees and harvest honey.</p>
            </div>
        </section>

        <section class="quick-actions">
            <h2>🛡️ Beekeeping Equipment</h2>
            <p>Equipment reduces sting damage when catching a wild Queen Bee.</p>
            <div id="beekeeping-equipment-card">Loading equipment...</div>
            <p id="beekeeping-equipment-message"></p>
        </section>

        <section id="hive-slots" class="crafting-grid"></section>

    </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/auth.js"></script><script src="../js/game-utils.js"></script>
<script src="../js/components.js"></script>
<script src="../js/config.js"></script><script src="../js/constants.js"></script>
<script src="../js/tutorial.js"></script>
<script src="../js/apiary.js"></script>

</body>
</html>
