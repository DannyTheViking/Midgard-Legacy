<!-- =====================================
     TOP BAR
     Shows player information and stats
====================================== -->

<header class="top-bar">

    <!-- ==============================
         PLAYER INFORMATION
    =============================== -->
<div class="topbar-player">

    <a
        id="topbar-profile-link"
        href="profile.html"
        class="topbar-player-name"
    >
        Loading...
    </a>

    <div class="topbar-player-details">

        <span id="topbar-level">
            Total Skill 0
        </span>

        <span>·</span>

        <span id="topbar-rank">
            Loading...
        </span>

    </div>

</div>
    <!-- ==============================
         PLAYER STATS
    =============================== -->

    <div class="player-stats">

        <div class="top-stat">
            💰
            <span id="silver">0</span>
        </div>

        <div class="top-stat" title="Mission Points">
            📜
            <span id="mission-points">0</span>
        </div>

        <div class="top-stat">
            ❤️
            <span id="health">— / —</span>
        </div>

        <div class="top-stat">
            ⚡
            <span id="energy">— / —</span>
        </div>

        <div class="top-stat">
            🌲
            <span id="stamina">— / —</span>
        </div>

        <div class="top-stat">
            🏆
            <span id="courage">— / —</span>
        </div>

    </div>


    <!-- ==============================
         TOP RIGHT ICONS
    =============================== -->

    <div class="top-icons">

        <a class="icon-button" href="players.html" aria-label="Search players" title="Search players">
            🔎
        </a>

        <button class="icon-button">
            ✉️
        </button>

        <a class="icon-button" href="tasks.html" aria-label="Daily, weekly and monthly tasks" title="Tasks">
            📜
        </a>

        <a class="icon-button notification-bell" href="notifications.html" aria-label="Notifications">
            🔔
            <span id="notification-unread-count" class="notification-unread-count" hidden>0</span>
        </a>

        <button class="icon-button">
            ⚙️
        </button>

    </div>

</header>
