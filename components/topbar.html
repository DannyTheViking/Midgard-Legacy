<!-- =====================================
     TOP BAR
     Shows player information and stats
====================================== -->

<header class="top-bar">

    <!-- ==============================
         PLAYER INFORMATION
    =============================== -->
<div class="topbar-player">

    <a
        id="topbar-profile-link"
        href="profile.html"
        class="topbar-player-name"
    >
        Loading...
    </a>

    <div class="topbar-player-details">

        <span id="topbar-level">
            Level 1
        </span>

        <span>·</span>

        <span id="topbar-rank">
            Loading...
        </span>

    </div>

</div>
    <!-- ==============================
         PLAYER STATS
    =============================== -->

    <div class="player-stats">

        <div class="top-stat">
            💰
            <span id="silver">0</span>
        </div>

        <div class="top-stat">
            ❤️
            <span id="health">— / —</span>
        </div>

        <div class="top-stat">
            ⚡
            <span id="energy">— / —</span>
        </div>

        <div class="top-stat">
            🌲
            <span id="stamina">— / —</span>
        </div>

        <div class="top-stat">
            🏆
            <span id="courage">— / —</span>
        </div>

    </div>


    <!-- ==============================
         TOP RIGHT ICONS
    =============================== -->

    <div class="top-icons">

        <button class="icon-button">
            ✉️
        </button>

        <button class="icon-button">
            🔔
        </button>

        <button class="icon-button">
            ⚙️
        </button>

    </div>

</header>
